name: Anonymize video (blur face + change voice)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Public URL of the source video"
        required: true
      pitch:
        description: "Voice pitch (<1 deeper, >1 higher)"
        required: false
        default: "0.85"
      blur:
        description: "Blur strength"
        required: false
        default: "45"
      out_name:
        description: "Output filename"
        required: false
        default: "IMG_2194_anon.mp4"

permissions:
  contents: write

jobs:
  anonymize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install opencv
        run: pip install --quiet opencv-python-headless numpy

      - name: Download source video
        run: |
          curl -fL --retry 3 -o input_source.mp4 "${{ github.event.inputs.video_url }}"
          ls -la input_source.mp4
          file input_source.mp4

      - name: Process (blur face + change voice)
        run: |
          python3 .github/anon/zamegli_obraz_in_glas.py input_source.mp4 \
            --pitch "${{ github.event.inputs.pitch }}" \
            --blur "${{ github.event.inputs.blur }}" \
            -o "out/${{ github.event.inputs.out_name }}"
          ls -la out/

      - name: Commit result back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "out/${{ github.event.inputs.out_name }}"
          git commit -m "Add anonymized video output"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload as artifact too
        uses: actions/upload-artifact@v4
        with:
          name: anonymized-video
          path: out/${{ github.event.inputs.out_name }}
